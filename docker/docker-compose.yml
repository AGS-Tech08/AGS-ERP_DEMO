services:
  mysql:
    image: mysql:8.0
    container_name: ags_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ags_root_123
      MYSQL_DATABASE: ags_erp
      MYSQL_USER: ags_user
      MYSQL_PASSWORD: ags_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: ags_redis
    restart: always
    ports:
      - "6379:6379"

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ags_php
    working_dir: /var/www/html
    volumes:
      - ../backend:/var/www/html
    ports:
      - "8000:8000"
    tty: true

volumes:
  mysql_data: